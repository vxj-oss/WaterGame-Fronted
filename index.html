<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <title>Fuego y Agua</title>
    <style>
      :root {
        --void: #000000;
        --bone: #ffffff;
        --charcoal: #444345;
        --frost: #e2e2e2;
        --ash: #b8bab9;
        --display: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; background: var(--void); overflow: hidden; overscroll-behavior: none;
        touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
      }
      #game { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; background: var(--void); }
      #game canvas { display: block; }

      /* Controles táctiles: planos, sin sombras, esquinas de 2px y borde hairline */
      #touch {
        position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: flex-end;
        padding: 0 max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
        pointer-events: none; z-index: 5;
      }
      #touch .grp { display: flex; gap: 10px; pointer-events: auto; }
      #touch button {
        width: 62px; height: 62px; border-radius: 2px; border: 1px solid rgba(226, 226, 226, 0.6); background: rgba(68, 67, 69, 0.4);
        color: var(--bone); font: 400 26px/1 var(--mono); touch-action: none; padding: 0;
      }
      #touch button.on { background: rgba(255, 255, 255, 0.35); }
      #touch #role { width: 40px; height: 40px; font-size: 13px; align-self: flex-end; }

      #rotate {
        display: none; position: fixed; inset: 0; z-index: 30; background: var(--void); color: var(--bone);
        font: 400 13px/1.5 var(--mono); text-transform: uppercase; letter-spacing: -0.02em; text-align: left;
        align-items: flex-end; justify-content: flex-start; padding: 40px 28px;
      }
      #rotate b { display: block; font: 400 56px/0.78 var(--display); text-transform: none; margin-bottom: 20px; }
      #rotate b span { display: block; width: 45%; border-bottom: 1px solid var(--frost); padding-bottom: 6px; margin-bottom: 14px; }
      @media (orientation: portrait) and (max-width: 700px) { #rotate { display: flex; } }

      /* Pantallas HTML (login y mesa) sobre el lienzo */
      #ui {
        display: none; position: fixed; inset: 0; z-index: 20; background: var(--void); color: var(--bone);
        align-items: center; justify-content: center; overflow: auto; padding: 20px;
        font: 400 13px/1.3 var(--mono); touch-action: auto; user-select: text; -webkit-user-select: text;
      }
      .card { width: 100%; max-width: 440px; margin: auto; display: flex; flex-direction: column; gap: 20px; text-align: left; }
      .card h2 { margin: 0; font: 400 40px/1 var(--display); letter-spacing: 0; }
      .card h2::after { content: ''; display: block; width: 45%; border-bottom: 1px solid var(--frost); padding-top: 8px; }
      .card p { margin: 0; color: var(--ash); text-transform: uppercase; letter-spacing: -0.02em; }
      .card p b { color: var(--bone); font-weight: 400; }
      .card small { color: var(--ash); text-transform: uppercase; }
      .card button, .card input {
        font: 400 13px/1 var(--mono); text-transform: uppercase; letter-spacing: -0.02em; padding: 14px 20px;
        border-radius: 2px; border: 1px solid var(--frost); background: var(--charcoal); color: var(--bone); width: 100%;
      }
      .card button { cursor: pointer; }
      .card button:hover:not(:disabled) { background: #5a585b; }
      .card button:disabled { opacity: 0.35; cursor: default; }
      .card .ghost { background: transparent; border-color: rgba(226, 226, 226, 0.3); }
      .card input { background: var(--void); text-align: left; }
      .card input::placeholder { color: var(--ash); opacity: 0.7; }
      .card .err { color: var(--bone); min-height: 1.3em; }
      .card .status::before { content: '○ '; }
      .card .status.ok { color: var(--bone); }
      .card .status.ok::before { content: '● '; }
      .code { font: 400 64px/0.9 var(--display); letter-spacing: 0.12em; }
      .code::after { content: ''; display: block; width: 45%; border-bottom: 1px solid var(--frost); padding-top: 10px; }
      .row { display: flex; gap: 12px; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui"></div>
    <div id="rotate">
      <div>
        <b><span>Gira</span>tu teléfono</b>
        Juega en horizontal
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
