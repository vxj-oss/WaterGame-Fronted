<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1b24" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Fuego y Agua</title>
    <style>
      :root {
        --ink: #0b1b24;
        --ink2: #10303c;
        --card: #15384a;
        --card-hi: #1f4f66;
        --text: #f7f3ea;
        --mute: #8fb4c0;
        --ember: #ff7a3d;
        --ember2: #ff4d6d;
        --lagoon: #2ed3e6;
        --lagoon2: #3b8cff;
        --gold: #ffd166;
        --display: 'Lilita One', 'Baloo 2', 'Arial Rounded MT Bold', system-ui, sans-serif;
        --body: Nunito, 'Segoe UI', system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; background: var(--ink); overflow: hidden; overscroll-behavior: none;
        touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
        font-family: var(--body);
      }
      #game { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; background: var(--ink); }
      #game canvas { display: block; }

      #touch {
        position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: flex-end;
        padding: 0 max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
        pointer-events: none; z-index: 5;
      }
      #touch .grp { display: flex; gap: 12px; pointer-events: auto; align-items: flex-end; }
      #touch button {
        width: 66px; height: 66px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.28);
        background: radial-gradient(circle at 35% 25%, rgba(120, 220, 240, 0.55), rgba(31, 79, 102, 0.55));
        color: #fff; font: 800 30px/1 var(--body); touch-action: none; padding: 0;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
        transition: transform 0.08s ease, background 0.08s ease;
      }
      #touch button[data-k='up'] { background: radial-gradient(circle at 35% 25%, rgba(255, 190, 120, 0.7), rgba(255, 77, 109, 0.5)); width: 74px; height: 74px; }
      #touch button { position: relative; -webkit-touch-callout: none; }
      #touch button::before { content: ''; position: absolute; inset: -10px; border-radius: 50%; }
      #touch button.on { transform: scale(0.94); background: rgba(255, 255, 255, 0.45); }
      #touch #role { width: 42px; height: 42px; font-size: 15px; }

      #rotate {
        display: none; position: fixed; inset: 0; z-index: 30; color: var(--text); text-align: center;
        background: radial-gradient(60% 50% at 20% 100%, rgba(255, 106, 61, 0.35), transparent 60%),
          radial-gradient(60% 50% at 90% 0%, rgba(46, 211, 230, 0.3), transparent 60%), linear-gradient(180deg, #0f2c39, #09171f);
        align-items: center; justify-content: center; padding: 32px; font: 700 17px/1.4 var(--body);
      }
      #rotate b { display: block; font: 400 52px/1 var(--display); margin-bottom: 12px; background: linear-gradient(90deg, #ffd36b, #ff7a3d, #ff4d6d); -webkit-background-clip: text; background-clip: text; color: transparent; }
      #rotate i { display: block; font-style: normal; font-size: 54px; margin-bottom: 8px; animation: tilt 1.6s ease-in-out infinite; }
      @keyframes tilt { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (max-width: 700px) { #rotate { display: flex; } }

      #ui {
        display: none; position: fixed; inset: 0; z-index: 20; color: var(--text); align-items: center; justify-content: center;
        overflow: auto; padding: 20px; font: 700 16px/1.35 var(--body); touch-action: auto; user-select: text; -webkit-user-select: text;
        background: radial-gradient(60% 50% at 12% 100%, rgba(255, 106, 61, 0.32), transparent 60%),
          radial-gradient(60% 50% at 92% 0%, rgba(46, 211, 230, 0.28), transparent 60%), linear-gradient(180deg, #0f2c39, #09171f);
        animation: fade 0.25s ease both;
      }
      #ui::before, #ui::after {
        content: ''; position: fixed; width: 46vmin; height: 46vmin; border-radius: 50%; filter: blur(60px); opacity: 0.35; pointer-events: none;
        animation: drift 14s ease-in-out infinite alternate;
      }
      #ui::before { background: #ff6a3d; left: -12vmin; bottom: -14vmin; }
      #ui::after { background: #2ed3e6; right: -12vmin; top: -14vmin; animation-delay: -6s; }
      @keyframes drift { to { transform: translate(8vmin, -6vmin) scale(1.15); } }
      @keyframes fade { from { opacity: 0; } }
      @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(0.92); } }

      .card {
        position: relative; z-index: 1; width: 100%; max-width: 480px; margin: auto; display: flex; flex-direction: column; gap: 18px;
        padding: 30px 28px 26px; border-radius: 30px; text-align: left;
        background: linear-gradient(180deg, rgba(31, 79, 102, 0.94), rgba(15, 46, 59, 0.96));
        box-shadow: 0 0 0 1.5px rgba(46, 211, 230, 0.32), 0 0 0 5px rgba(46, 211, 230, 0.06), 0 30px 80px rgba(0, 0, 0, 0.55);
        animation: pop 0.38s cubic-bezier(0.2, 1.2, 0.3, 1) both;
      }
      .brand { display: flex; align-items: center; gap: 10px; }
      .brand svg { width: 34px; height: 34px; }
      .brand .f { color: var(--ember); filter: drop-shadow(0 0 8px rgba(255, 122, 61, 0.7)); }
      .brand .w { color: var(--lagoon); filter: drop-shadow(0 0 8px rgba(46, 211, 230, 0.7)); margin-left: -12px; }
      .brand span { font: 700 12px/1 var(--body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--mute); }
      .card h2 {
        margin: 0; font: 400 44px/1 var(--display); background: linear-gradient(90deg, #ffd36b, #ff7a3d 45%, #ff4d6d);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .card p { margin: 0; color: var(--mute); font-weight: 700; }
      .card p b { color: var(--text); font-weight: 800; }
      .card small { color: var(--mute); }

      .btn, .card button, .card input {
        font: 800 17px/1 var(--body); padding: 16px 22px; border-radius: 18px; border: 0; color: #fff; width: 100%;
      }
      .card button {
        cursor: pointer; position: relative; background: linear-gradient(180deg, #ffa862, #ff4d6d);
        box-shadow: 0 8px 22px rgba(255, 90, 70, 0.4), inset 0 1.5px 0 rgba(255, 255, 255, 0.45);
        transition: transform 0.12s cubic-bezier(0.2, 1.4, 0.4, 1), filter 0.12s ease, box-shadow 0.12s ease;
      }
      .card button:hover:not(:disabled) { transform: translateY(-3px) scale(1.015); filter: brightness(1.08); box-shadow: 0 12px 28px rgba(255, 90, 70, 0.5), inset 0 1.5px 0 rgba(255, 255, 255, 0.45); }
      .card button:active:not(:disabled) { transform: translateY(1px) scale(0.97); }
      .card button:focus-visible, .card input:focus-visible { outline: 3px solid var(--lagoon); outline-offset: 2px; }
      .card button:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(0.6); box-shadow: none; }
      .card button.lagoon { background: linear-gradient(180deg, #62e8f4, #3b8cff); box-shadow: 0 8px 22px rgba(46, 170, 235, 0.4), inset 0 1.5px 0 rgba(255, 255, 255, 0.45); }
      .card button.ghost { background: rgba(255, 255, 255, 0.08); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.2); }
      .card button.ghost:hover:not(:disabled) { background: rgba(255, 255, 255, 0.14); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.34); }
      .card input { background: rgba(0, 0, 0, 0.28); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.18); text-align: left; }
      .card input::placeholder { color: var(--mute); opacity: 0.8; }
      .card input.code-in { text-align: center; letter-spacing: 0.4em; font: 400 28px/1 var(--display); text-transform: uppercase; }
      .card .err { min-height: 1.3em; color: #ff9aa8; font-weight: 800; }

      .code { display: flex; gap: 8px; justify-content: center; }
      .code span {
        flex: 1; max-width: 58px; aspect-ratio: 0.82; display: grid; place-items: center; border-radius: 16px; font: 400 36px/1 var(--display);
        background: linear-gradient(180deg, #2a6783, #1a4a60); box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, 0.25), 0 6px 14px rgba(0, 0, 0, 0.3);
        animation: pop 0.4s cubic-bezier(0.2, 1.3, 0.3, 1) both;
      }
      .code span:nth-child(2) { animation-delay: 0.05s; } .code span:nth-child(3) { animation-delay: 0.1s; }
      .code span:nth-child(4) { animation-delay: 0.15s; } .code span:nth-child(5) { animation-delay: 0.2s; } .code span:nth-child(6) { animation-delay: 0.25s; }

      .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .slot { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 10px; border-radius: 22px; background: rgba(0, 0, 0, 0.22); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.1); text-align: center; }
      .slot .av { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
      .slot .av svg { width: 32px; height: 32px; }
      .slot.fire .av { background: linear-gradient(180deg, #ffb347, #ff4d6d); box-shadow: 0 0 22px rgba(255, 110, 70, 0.55); }
      .slot.water .av { background: linear-gradient(180deg, #8eefff, #3b8cff); box-shadow: 0 0 22px rgba(46, 190, 235, 0.55); }
      .slot.off .av { filter: grayscale(1); opacity: 0.35; box-shadow: none; }
      .slot b { font-weight: 800; }
      .slot em { font-style: normal; font-size: 13px; color: var(--mute); display: flex; align-items: center; gap: 6px; }
      .slot em::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: #5a7886; }
      .slot.on em { color: #8affc0; }
      .slot.on em::before { background: #3dffa0; animation: ping 1.4s ease-out infinite; }
      .slot.off em::before { animation: blink 1.2s ease-in-out infinite; }
      @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(61, 255, 160, 0.7); } 100% { box-shadow: 0 0 0 10px rgba(61, 255, 160, 0); } }
      @keyframes blink { 50% { opacity: 0.25; } }
      .row { display: flex; gap: 12px; }
      .row > button { flex: 1; }
      .link { background: none !important; box-shadow: none !important; color: var(--mute) !important; padding: 8px !important; font-size: 15px !important; }
      .link:hover:not(:disabled) { color: var(--text) !important; transform: none !important; filter: none !important; }

      @media (prefers-reduced-motion: reduce) {
        #ui, #ui::before, #ui::after, .card, .code span, .slot em::before, #rotate i { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui"></div>
    <div id="rotate">
      <div>
        <i>📱</i>
        <b>Gira tu teléfono</b>
        Se juega en horizontal
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
